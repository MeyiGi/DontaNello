name: Python quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install package and development dependencies
        run: .venv/bin/python -m pip install -e ".[dev,diagnostics]"

      - name: Check repository secrets
        run: .venv/bin/python scripts/check_secrets.py

      - name: Run project quality gate
        run: make check
